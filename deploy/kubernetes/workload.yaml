apiVersion: v1
kind: ServiceAccount
metadata:
  name: securefi-api
  namespace: securefi
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securefi-api
  namespace: securefi
spec:
  replicas: 1
  selector:
    matchLabels: {app: securefi-api}
  template:
    metadata:
      labels: {app: securefi-api}
    spec:
      serviceAccountName: securefi-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: securefi:2.1.0
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SECUREFI_AUTH_FILE, value: /run/securefi/access.json}
            - {name: SECUREFI_ALLOWED_HOSTS, value: "127.0.0.1,localhost,securefi.local"}
            - name: SECUREFI_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: securefi-runtime, key: database-url}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: access, mountPath: /run/securefi, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: access
          secret: {secretName: securefi-access, defaultMode: 0440} # pragma: allowlist secret; object reference
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: securefi-api
  namespace: securefi
spec:
  selector: {app: securefi-api}
  ports: [{port: 8080, targetPort: 8080}]
  type: ClusterIP
