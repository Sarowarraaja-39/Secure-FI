title: SecureFI Authentication Failure Selection
id: 2c296f1a-a74a-48be-94da-f8a6758c3315
name: securefi_auth_failure
status: experimental
description: Selection rule for the accompanying event-count correlation; synthetic SecureFI schema.
author: SecureFI contributors
logsource:
  product: securefi
  category: authentication
detection:
  selection:
    source: identity
    data.operation: login
    data.result: failure
  condition: selection
falsepositives: [Expired credentials, Misconfigured service]
level: medium
tags: [attack.credential-access, attack.t1110]
